name: Build Combined Open PRs

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - closed

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERIFICATION_BRANCH: unstable/dev

jobs:
  merge-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      # 1. Check out the base branch (main)
      - name: Checkout Base Branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # 2. Configure Git Identity
      - name: Set up Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3. Fetch all open, non-draft PRs sorted oldest to newest and merge them
      - name: Merge All Open PRs
        id: merge_step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching open, non-draft pull requests (Oldest First)..."
          PR_BRANCHES=$(gh pr list --state open --draft=false --json headRefName,createdAt --jq 'sort_by(.createdAt) | .[].headRefName')

          if [ -z "$PR_BRANCHES" ] || [ "$PR_BRANCHES" = "" ]; then
            echo "has_prs=false" >> $GITHUB_OUTPUT
            echo "No open, ready-for-review PRs found. Preview branch will reset to main."
          else
            echo "has_prs=true" >> $GITHUB_OUTPUT
            # Clean up any local branches from previous runs
            git branch | grep -v '^*' | grep -v 'main' | grep -v "${{ env.VERIFICATION_BRANCH }}" | xargs -r git branch -D || true

            for branch in $PR_BRANCHES; do
              echo "--------------------------------------------------"
              echo "Attempting to merge branch: $branch"
              echo "--------------------------------------------------"

              git fetch origin "$branch:$branch" || {
                echo "❌ Failed to fetch branch '$branch' (may be from a fork). Skipping."
                continue
              }

              if ! git merge "$branch" --no-ff --no-edit -m "Merge branch '$branch' into combined preview"; then
                echo "❌ CRITICAL: Conflict detected merging branch '$branch'!"
                conflicting_pr=$(gh pr list --state all --head "$branch" --json number,title,url --jq '.[0] | if . == null then "No associated PR found" else "[#\(.number): \(.title)](\(.url))" end' || printf 'Pull request lookup failed')
                printf '%s\n%s\n' "$branch" "$conflicting_pr" > conflicting_details.txt
                git merge --abort || true
                exit 1
              fi
              echo "✅ Successfully merged $branch"
              git branch -D "$branch" || true
            done
          fi

      # 4. Push to a Fixed Verification Branch (Overwrites on each run)
      - name: Push Combined Verification Branch
        run: |
          echo "Updating fixed verification branch: ${{ env.VERIFICATION_BRANCH }}"
          git checkout -B ${{ env.VERIFICATION_BRANCH }}
          git push origin ${{ env.VERIFICATION_BRANCH }} --force-with-lease

      # 5. Post a comment on the triggering PR if a merge conflict occurs
      - name: Post Failure Comment to PR
        if: failure() && github.event_name == 'pull_request' && steps.merge_step.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let conflictingBranch = 'Unknown branch';
            let conflictingPr = 'Unknown pull request';
            if (fs.existsSync('conflicting_details.txt')) {
              const [branch, ...pullRequestLines] = fs.readFileSync('conflicting_details.txt', 'utf8').trimEnd().split('\n');
              conflictingBranch = branch || conflictingBranch;
              conflictingPr = pullRequestLines.join('\n') || conflictingPr;
            }

            const issue_number = context.issue.number;
            const body = `🚨 **Combined Integration Build Failed** 🚨\n\nThis pull request could not be safely packaged into the combined preview build because a git merge conflict was detected with branch: \`${conflictingBranch}\` (associated PR: ${conflictingPr}).\n\nBecause older, ready-to-review PRs are processed first, please check for architectural overlaps with newer code changes or the base branch.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: body
            });

      # 6. Authenticate to GitHub Packages (GHCR)
      # Skip if there are no open PRs left (saves actions minutes)
      - name: Log in to the Container Registry
        if: steps.merge_step.outputs.has_prs != 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Extract metadata for Docker tags
      - name: Extract Docker metadata
        if: steps.merge_step.outputs.has_prs != 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=unstable/dev
            type=raw,value=combined-{{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=combined-latest

      # 8. Set up Docker Buildx
      - name: Set up Docker Buildx
        if: steps.merge_step.outputs.has_prs != 'false'
        uses: docker/setup-buildx-action@v3

      # 9. Build and push the Docker image
      - name: Build and Push Docker Image
        if: steps.merge_step.outputs.has_prs != 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          platforms: linux/amd64
